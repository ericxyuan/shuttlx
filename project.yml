name: ShuttlX
options:
  bundleIdPrefix: com.shuttlx
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
packages:
  ShuttlXCore:
    path: Packages/ShuttlXCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  ShuttlX:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShuttlX
        excludes: [Info.plist, ShuttlX.entitlements]
      - path: Shared/Connectivity
        excludes: [WatchWidgetSnapshot.swift]
      - path: Shared/Equipment
      - path: Resources/catalogue-development.json
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ShuttlXCore
      - target: ShuttlXWidgets
        embed: true
      - target: ShuttlXWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuttlx.app
        INFOPLIST_FILE: ShuttlX/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShuttlX/ShuttlX.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  ShuttlXWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShuttlXWidgets
        excludes: [Info.plist, ShuttlXWidgets.entitlements]
      - path: Shared/Connectivity/PhoneWidgetSnapshot.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuttlx.app.widgets
        INFOPLIST_FILE: ShuttlXWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShuttlXWidgets/ShuttlXWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ShuttlXWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ShuttlXWatch
        excludes: [Info.plist, ShuttlXWatch.entitlements]
      - path: Shared/Connectivity
        excludes: [PhoneWidgetSnapshot.swift]
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ShuttlXCore
      - target: ShuttlXWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuttlx.app.watchkitapp
        INFOPLIST_FILE: ShuttlXWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShuttlXWatch/ShuttlXWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  ShuttlXWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ShuttlXWatchWidgets
        excludes: [Info.plist, ShuttlXWatchWidgets.entitlements]
      - path: Shared/Connectivity/WatchWidgetSnapshot.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuttlx.app.watchkitapp.widgets
        INFOPLIST_FILE: ShuttlXWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShuttlXWatchWidgets/ShuttlXWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  ShuttlX:
    build:
      targets:
        ShuttlX: all
    run:
      config: Debug
  ShuttlXWatch:
    build:
      targets:
        ShuttlXWatch: all
    run:
      config: Debug
